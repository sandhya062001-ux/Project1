<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard - Appointment Booking System</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Customer Dashboard</a>
            <a href="/" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-white py-3">
                        <h4 class="mb-0 text-primary fw-bold">Book an Appointment</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- Booking Form connected to Flask /book-appointment route -->
                        <form action="/book-appointment" method="POST">
                            <div class="mb-3">
                                <label class="form-label">Your Email</label>
                                <input type="email" class="form-control" name="customer_email" placeholder="Enter your email address" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Select Service Provider</label>
                                <input type="text" class="form-control" name="provider_name" placeholder="Enter doctor or provider name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Appointment Date</label>
                                <input type="date" class="form-control" name="appointment_date" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Select Time Slot</label>
                                <input type="text" class="form-control" name="slot" placeholder="e.g. 10:00 AM - 10:30 AM" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-2">Confirm Booking</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
