<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Dashboard - Appointment Booking</title>
    <!-- Bootstrap 5 CDN for responsive mobile-friendly layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Provider Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="showProviderSection('availabilitySection')">Set Availability</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="showProviderSection('bookingsSection')">Manage Bookings</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-warning" href="index.html">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <!-- SECTION 1: SET WEEKLY AVAILABILITY -->
        <div id="availabilitySection" class="provider-section">
            <h2 class="mb-3">Set Weekly Availability & Working Hours</h2>
            <div class="card shadow-sm p-4">
                <form id="availabilityForm">
                    <div class="mb-3">
                        <label class="form-label">Select Working Days</label>
                        <div class="row">
                            <div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="Monday" id="mon"><label class="form-check-label" for="mon">Monday</label></div></div>
                            <div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="Tuesday" id="tue"><label class="form-check-label" for="tue">Tuesday</label></div></div>
                            <div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="Wednesday" id="wed"><label class="form-check-label" for="wed">Wednesday</label></div></div>
                            <div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="Thursday" id="thu"><label class="form-check-label" for="thu">Thursday</label></div></div>
                            <div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="Friday" id="fri"><label class="form-check-label" for="fri">Friday</label></div></div>
                            <div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="Saturday" id="sat"><label class="form-check-label" for="sat">Saturday</label></div></div>
                            <div class="col-md-3"><div class="form-check"><input class="form-check-input" type="checkbox" value="Sunday" id="sun"><label class="form-check-label" for="sun">Sunday</label></div></div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Start Time</label>
                            <input type="time" class="form-control" id="startTime" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">End Time</label>
                            <input type="time" class="form-control" id="endTime" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Slot Duration (Minutes)</label>
                        <select class="form-select" id="slotDuration">
                            <option value="15">15 Minutes</option>
                            <option value="30" selected>30 Minutes</option>
                            <option value="60">60 Minutes</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Save Availability</button>
                </form>
            </div>
        </div>

        <!-- SECTION 2: MANAGE BOOKINGS -->
        <div id="bookingsSection" class="provider-section" style="display: none;">
            <h2 class="mb-3">Customer Bookings & Schedule</h2>
            <div class="card shadow-sm p-3">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>Reference ID</th>
                            <th>Customer Name</th>
                            <th>Date & Time</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="providerBookingsTable">
                        <!-- Example Row -->
                        <tr>
